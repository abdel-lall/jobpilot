services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: jobpilot
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-}
      JOB_ANALYSIS_MODEL: ${JOB_ANALYSIS_MODEL:-stub}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-stub}
      DATABASE_URL: postgresql://postgres:jobpilot@postgres:5432/postgres
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      RESUME_STORAGE_DIR: /var/lib/jobpilot/resumes
    volumes:
      - resume-files:/var/lib/jobpilot/resumes
    depends_on:
      - postgres

  portfolio-mcp:
    build:
      context: .
      dockerfile: apps/portfolio-mcp/Dockerfile
    ports:
      - "3010:3010"
    environment:
      MCP_PORT: "3010"
      DATABASE_URL: postgresql://postgres:jobpilot@postgres:5432/postgres
      MCP_SHARED_SECRET: ${MCP_SHARED_SECRET:-dev-only-change-me}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-stub}
    depends_on:
      - postgres

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://api:3000
      VITE_API_ORIGIN: http://localhost:3000
    depends_on:
      - api

volumes:
  resume-files:
